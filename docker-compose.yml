services:
  estufa-server:
    build:
      context: ./estufa_server
    container_name: sentinela-smart-server
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ESTUFA_API_TOKEN: "${ESTUFA_API_TOKEN:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      DB_SSL_REQUIRE_VALIDATION: "${DB_SSL_REQUIRE_VALIDATION:-false}"
    restart: unless-stopped
