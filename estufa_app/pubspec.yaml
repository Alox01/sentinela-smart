name: estufa_app
description: Aplicativo de monitoramento e controle da Estufa Smart.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  fl_chart: ^1.1.1
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.3
  shared_preferences: ^2.3.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0
  # Ja vinha junto com o flutter_local_notifications; declarado porque o
  # agendamento de ajuste usa TZDateTime direto. Dart puro, sem parte nativa.
  timezone: ^0.11.1
  # Desenha o QR do convite de acesso. Dart puro, sem parte nativa: nao entra no
  # Gradle e nao pede permissao nenhuma.
  qr_flutter: ^4.1.0
  # Entrega ao app o endereco `sentinela://convite?c=...` que vem do QR. Tem
  # parte nativa, mas nao pede permissao: quem le o codigo e a camera comum do
  # celular, nao o app. Foi a alternativa deliberada a um leitor de QR embutido
  # (mobile_scanner e afins), que traria permissao de camera.
  app_links: ^7.2.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
