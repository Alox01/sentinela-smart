name: estufa_app
description: Aplicativo de monitoramento e controle da Estufa Smart.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  fl_chart: ^1.1.1
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.3
  shared_preferences: ^2.3.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0
  # Entrega o CSV do historico ao app que o produtor escolher (WhatsApp, e-mail,
  # arquivos). Sem isto o relatorio nao sai do celular.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
