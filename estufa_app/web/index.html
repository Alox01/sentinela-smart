<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="estufa_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>estufa_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #0E1012;
      overscroll-behavior: none;
    }

    body {
      overflow: auto;
    }

    flutter-view,
    flt-glass-pane {
      width: 100%;
      min-height: 100dvh;
      background: #0E1012;
    }
  </style>
  <script>
    (function () {
      function syncFlutterViewport() {
        window.scrollTo(0, 0);
        window.dispatchEvent(new Event('resize'));
      }

      window.addEventListener('resize', function () {
        setTimeout(syncFlutterViewport, 60);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          setTimeout(syncFlutterViewport, 80);
          setTimeout(syncFlutterViewport, 240);
        });
      }

      document.addEventListener('focusout', function () {
        setTimeout(syncFlutterViewport, 80);
        setTimeout(syncFlutterViewport, 260);
        setTimeout(syncFlutterViewport, 520);
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
