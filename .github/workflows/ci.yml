# Roda a cada push/PR: testes do servidor, analise e testes do app, alem de uma
# compilacao real do firmware. O app NAO e empacotado aqui - ver o comentario no
# job `app`.
name: CI

on:
  push:
  pull_request:

jobs:
  servidor:
    name: Servidor (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estufa_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estufa_server/package-lock.json
      - run: npm ci
      - run: npm test

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estufa_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      # NAO ha build aqui, e a razao vale registrar.
      #
      # Havia `flutter build web`, que morreu junto com a plataforma web
      # (04/08/2026). Trocar pelo APK parecia obvio - e o que se instala - mas o
      # build do Android exige `google-services.json`, que e do Firebase e esta
      # no .gitignore de proposito. A maquina do CI nao o tem, entao
      # `processReleaseGoogleServices` falha, e o vermelho passa a ser sobre o
      # segredo faltando, nao sobre o codigo.
      #
      # `flutter test` ja compila todo o Dart do app; o que fica descoberto e a
      # camada Gradle/Android. Para cobri-la seria preciso guardar o
      # `google-services.json` como secret do repositorio e escreve-lo aqui
      # antes do build. Vale o dia em que a camada Android quebrar sozinha - ate
      # la, e cerimonia com um segredo a mais para vazar.

  firmware:
    name: Firmware (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.2.0
          libraries: |
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
            - name: TM1637
            - name: ArduinoJson
          sketch-paths: |
            - firmware/sentinela_esp32
          enable-warnings-report: true
