# Roda a cada push/PR: testes do servidor, analise, testes e build do APK,
# alem de uma compilacao real do firmware.
name: CI

on:
  push:
  pull_request:

jobs:
  servidor:
    name: Servidor (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estufa_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estufa_server/package-lock.json
      - run: npm ci
      - run: npm test

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estufa_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      # Era `flutter build web`, que deixou de existir junto com a plataforma
      # web (04/08/2026). O APK e o que se instala de verdade, entao e ele que
      # vale provar que compila. O `--dart-define` acompanha porque sem ele o
      # app sobe com a nuvem desconfigurada - aqui nao muda o resultado da
      # compilacao, mas manter os dois comandos iguais evita que o de CI e o de
      # release se separem sem ninguem notar.
      - run: flutter build apk --release --dart-define=CLOUD_API_URL=https://estufa-server.onrender.com

  firmware:
    name: Firmware (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.2.0
          libraries: |
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
            - name: TM1637
            - name: ArduinoJson
          sketch-paths: |
            - firmware/sentinela_esp32
          enable-warnings-report: true
